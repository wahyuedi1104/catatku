  --b-kas:#187A4F;   --b2-kas:#0D4A31;   --a-kas:#187A4F;   --s-kas:rgba(24,122,79,.13);
  --b-hutang:#7A4FB0;--b2-hutang:#4A2B78;--a-hutang:#7A4FB0;--s-hutang:rgba(122,79,176,.13);
  --b-lain:#2E4257;  --b2-lain:#16222F;  --a-lain:#2E4257;  --s-lain:rgba(46,66,87,.12);
  --b-bta:#9A5B16;   --b2-bta:#6A3A0A;   --a-bta:#9A5B16;   --s-bta:rgba(154,91,22,.13);
  --sat:var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --sab:var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --nav:66px;
  --col:520px;
  --shadow:0 6px 18px rgba(8,16,24,.10);
}
:root[data-theme=dark]{
  --bg:#0E151D; --panel:#16212C; --ink:#E7ECF1; --ink2:#97A5B3; --line:#25323F; --field:#1C2935; --onacc:#0E151D;
  --in:#58C795; --out:#F2767F; --warn:#E3B04B; --warn-bg:rgba(227,176,75,.16);
  --in-bg:rgba(88,199,149,.16); --out-bg:rgba(242,118,127,.16); --tf:#7DB0EE; --tf-bg:rgba(125,176,238,.16);
  --b-todo:#1D416F;  --b2-todo:#112A4B;  --a-todo:#7DB0EE;  --s-todo:rgba(125,176,238,.16);
  --b-kas:#14543A;   --b2-kas:#0A3323;   --a-kas:#58C795;   --s-kas:rgba(88,199,149,.16);
  --b-hutang:#4D3377;--b2-hutang:#311F54;--a-hutang:#B896E8;--s-hutang:rgba(184,150,232,.16);
  --b-lain:#1F2D3B;  --b2-lain:#111A23;  --a-lain:#A9B6C3;  --s-lain:rgba(169,182,195,.14);
  --b-bta:#5B3710;   --b2-bta:#3A2208;   --a-bta:#E3A455;   --s-bta:rgba(227,164,85,.16);
  --shadow:0 6px 18px rgba(0,0,0,.35);
}
body[data-tab=todo]{--band:var(--b-todo);--band2:var(--b2-todo);--acc:var(--a-todo);--soft:var(--s-todo)}
body[data-tab=kas]{--band:var(--b-kas);--band2:var(--b2-kas);--acc:var(--a-kas);--soft:var(--s-kas)}
body[data-tab=hutang]{--band:var(--b-hutang);--band2:var(--b2-hutang);--acc:var(--a-hutang);--soft:var(--s-hutang)}
body[data-tab=lain]{--band:var(--b-lain);--band2:var(--b2-lain);--acc:var(--a-lain);--soft:var(--s-lain)}
body[data-tab=bta]{--band:var(--b-bta);--band2:var(--b2-bta);--acc:var(--a-bta);--soft:var(--s-bta)}

/* ===== Dasar ===== */
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font:500 15px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none;-webkit-touch-callout:none}
input,textarea{font:inherit;color:inherit}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
#sbar{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--band);z-index:20;transition:background-color .3s}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + 100px);-webkit-overflow-scrolling:touch}

/* ===== Header modul: pita uang kertas dengan pola rosette ===== */
.hd{position:relative;overflow:hidden;color:#fff;padding:calc(var(--sat) + 18px) 18px 22px;background:linear-gradient(165deg,var(--band) 0%,var(--band2) 100%);transition:background .3s}
.hd::before,.hd::after{content:"";position:absolute;border-radius:50%;pointer-events:none;
  background:repeating-radial-gradient(circle at 40% 44%,transparent 0 5px,rgba(255,255,255,.08) 5px 6px),repeating-radial-gradient(circle at 60% 56%,transparent 0 5px,rgba(255,255,255,.08) 5px 6px);
  -webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%);mask-image:radial-gradient(circle,#000 25%,transparent 68%)}
.hd::before{right:-100px;top:-110px;width:340px;height:340px}
.hd::after{left:-150px;bottom:-190px;width:300px;height:300px;opacity:.55}
.hd>*{position:relative;z-index:1}
.hd.pulls{padding-bottom:38px}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.hd-l{min-width:0;flex:1}
.hd-k{font-size:13px;font-weight:600;color:rgba(255,255,255,.8)}
.hd-big{font-size:clamp(26px,8.2vw,34px);line-height:1.15;font-weight:800;letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}
.hd-big.n2{font-size:clamp(22px,6.6vw,28px)}
.hd-big.n3{font-size:clamp(20px,5.6vw,24px)}
.hd-big .cur{font-size:.5em;font-weight:700;margin-right:.3em;letter-spacing:0;opacity:.85}
.hd-sub{margin-top:4px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.85)}
.hd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hp{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12.5px;font-weight:700}
.hp svg{width:14px;height:14px;stroke-width:2.6}
.hp.bad{background:#fff;color:#B3202B}
.mon{display:flex;align-items:center;gap:4px;margin-top:16px}
.mon b{min-width:112px;text-align:center;font-weight:700;font-size:14.5px}
.mon button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.mon svg{width:20px;height:20px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pair>div{background:rgba(0,0,0,.2);border-radius:14px;padding:10px 12px;min-width:0}
.pair span{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8)}
.pair b{display:block;font-size:clamp(14px,4.3vw,16px);font-weight:800;margin-top:1px;white-space:nowrap}
.hseg{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.22);border-radius:14px;padding:3px;margin-bottom:16px}
.hseg button{padding:9px;border-radius:11px;text-align:center;font-weight:700;color:rgba(255,255,255,.86)}
.hseg button.on{background:#fff;color:var(--band)}
:root[data-theme=dark] .hseg button.on{color:#fff;background:rgba(255,255,255,.2)}
.hd-bar{height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:14px}
.hd-bar i{display:block;height:100%;border-radius:4px;background:#fff}
.hd-cap{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.88)}
.hd-cap b{font-weight:800;color:#fff}

/* lingkaran progres di header Tugas */
.ringw{position:relative;width:88px;height:88px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:3}
.ringw .rt0{stroke:rgba(255,255,255,.2)}
.ringw .rt1{stroke:#fff;stroke-linecap:round;transition:stroke-dasharray .5s cubic-bezier(.3,.8,.3,1)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05}
.rc b{font-size:20px;font-weight:800}
.rc small{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.8);margin-top:3px}
.rc svg{width:30px;height:30px;transform:none;stroke-width:2.6}

/* kartu yang menumpang di bawah header */
.pull{position:relative;z-index:2;margin:-22px 14px 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.qa{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 16px}
.qa:focus-within{border-color:var(--acc)}
.qa input{flex:1;min-width:0;height:44px;border:0;background:none;outline:0;font-weight:600;font-size:16px;-webkit-appearance:none;appearance:none;border-radius:0}
.qa input::placeholder{color:var(--ink2);opacity:.8}
.qa button{width:44px;height:44px;border-radius:14px;background:var(--acc);color:var(--onacc);display:grid;place-items:center}
.qa button svg{width:22px;height:22px;stroke-width:2.6}
.pcard{padding:14px 16px}
.pcard h3{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:9px}
.pcard h3 b{color:var(--ink)}
.pcard .bar{height:8px;border-radius:5px}

/* ===== Chip & filter ===== */
.flt{display:flex;gap:8px;overflow-x:auto;padding:16px 14px 2px;scrollbar-width:none}
.flt::-webkit-scrollbar{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13.5px;white-space:nowrap;text-align:center}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chip.sm{padding:6px 11px;font-size:12.5px;background:transparent}
.chip small{font-weight:700;opacity:.75;margin-left:4px}

/* ===== Daftar ===== */
.sec{display:flex;justify-content:space-between;gap:10px;padding:18px 18px 8px;font-size:13px;font-weight:700;color:var(--ink2)}
.sec.bad{color:var(--out)}
.sec.warn{color:var(--warn)}
.sec span:last-child{font-weight:700}
.pos{color:var(--in)}.neg{color:var(--out)}
.dg{margin:0 14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:relative;width:100%}
.dg .row:last-child{border-bottom:0}
button.row{transition:background-color .12s}
button.row:active{background:var(--field)}
.rbody{display:block;text-align:left;min-width:0}
.rt{display:block;font-weight:700;overflow-wrap:anywhere}
.rm{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;margin-top:3px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.rm.pills{gap:5px 6px}
.rm .bad{color:var(--out)}.rm .warn{color:var(--warn)}
.pl2{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--field);font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pl2 svg{width:12px;height:12px;stroke-width:2.4}
.rm .pl2.bad{background:var(--out-bg);color:var(--out)}
.rm .pl2.warn{background:var(--warn-bg);color:var(--warn)}

/* baris tugas */
.row.tk{grid-template-columns:auto 1fr;gap:4px}
.chk{width:44px;height:44px;margin:-8px 0 -8px -8px;display:grid;place-items:center;color:var(--onacc);border-radius:50%}
.chk>*{grid-area:1/1}
.chk::before{content:"";grid-area:1/1;width:26px;height:26px;border-radius:50%;border:2px solid var(--ck,var(--acc));transition:background-color .15s,border-color .15s}
.chk svg{width:15px;height:15px;stroke-width:3.4;opacity:0;transform:scale(.6);transition:transform .18s cubic-bezier(.3,1.6,.5,1),opacity .12s}
.row.p-high{--ck:var(--out)}
.row.p-low{--ck:var(--ink2)}
.row.done .chk::before{background:var(--acc);border-color:var(--acc)}
.row.done .chk svg{opacity:1;transform:none}
.row.done .rt{text-decoration:line-through;color:var(--ink2);font-weight:600}
.row.done .pl2{opacity:.7}

/* baris hutang */
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--av,#6B7785);flex:none;letter-spacing:.02em}
.row.debt{grid-template-columns:auto 1fr auto;text-align:left}
.row.trx{grid-template-columns:auto 1fr auto;text-align:left}
.row .amt{text-align:right;font-weight:800;white-space:nowrap}
.row .amt small{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
.bar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.row .bar{margin-top:8px}

/* keadaan kosong */
.empty{padding:40px 28px 24px;text-align:center;color:var(--ink2);font-weight:600;display:flex;flex-direction:column;align-items:center}
.empty .eic{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--acc);margin-bottom:14px}
.empty .eic svg{width:32px;height:32px;stroke-width:1.9}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty p{max-width:290px;font-size:13.5px}
.empty .btn{margin-top:16px;min-height:44px;padding:0 20px}

.blk{padding:18px 14px 0}
.blk h3{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--ink2);margin:0 4px 9px}
.blk h3 small{font-weight:600}

/* ===== FAB & nav ===== */
#fab{position:fixed;right:max(18px,calc(50% - var(--col) / 2 + 18px));bottom:calc(var(--nav) + var(--sab) + 16px);z-index:15;display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border-radius:17px;
  background:var(--acc);color:var(--onacc);font-weight:800;box-shadow:0 8px 20px rgba(8,16,24,.3);transition:background-color .3s,transform .12s}
#fab:active{transform:scale(.96)}
#nav{position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:10}
#nav button{height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink2);position:relative;text-align:center;padding-top:2px}
#nav .ic{position:relative;display:grid;place-items:center;width:58px;height:31px;border-radius:16px;transition:background-color .2s}
#nav .ic svg{width:23px;height:23px}
#nav button.on{color:var(--acc)}
#nav button.on .ic{background:var(--soft)}
#nav button:active .ic{background:var(--soft)}
#nav .dot{position:absolute;top:7px;right:calc(50% - 25px);width:10px;height:10px;border-radius:50%;background:var(--out);border:2px solid var(--panel)}

/* ===== BTA & preview ===== */
#btaPane{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--band2)}
#btaPane .hd{display:flex;align-items:center;gap:13px;padding-bottom:30px}
.hd-ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.hd-ic svg{width:24px;height:24px}
.hd-t{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
#btaFrame{flex:1;width:100%;min-height:0;border:0;background:#f3f5f9;display:block;margin-top:-16px;border-radius:20px 20px 0 0;position:relative;z-index:2}
.pvw{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:12px;margin:10px 0 6px}
.pvt{width:100%;border-collapse:collapse;font-size:13px}
.pvt th{position:sticky;top:0;background:var(--field);text-align:left;padding:8px 10px;font-size:12px;color:var(--ink2);white-space:nowrap}
.pvt td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;white-space:nowrap}
.pvt td.w{white-space:normal;overflow-wrap:anywhere;min-width:110px}
.pvt .r{text-align:right;white-space:nowrap}

/* ===== Sheet ===== */
#sheetRoot{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheetRoot.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(8,14,20,.55);opacity:0;transition:opacity .22s}
#sheetRoot.on .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--panel);border-radius:24px 24px 0 0;transform:translateY(102%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(20px + var(--sab));overscroll-behavior:contain}
#sheetRoot.on .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sx{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--ink2);z-index:3}
.sx svg{width:18px;height:18px;stroke-width:2.4}
.sheet h2{font-size:19px;font-weight:800;letter-spacing:-.01em;padding-right:44px;overflow-wrap:anywhere}
.sheet .sub{color:var(--ink2);font-weight:600;font-size:13.5px;margin-top:2px}
.fl{display:block;margin-top:16px}
.lb{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
/* 16px supaya iOS tidak memperbesar halaman saat kolom difokuskan */
.in{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:0 14px;font-size:16px;-webkit-appearance:none;appearance:none}
input[type=date].in{display:block;min-width:0;text-align:left;line-height:48px}
input[type=date].in::-webkit-date-and-time-value{text-align:left}
textarea.in{padding:12px 14px;resize:none;display:block}
.in:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.amtw{position:relative}
.amtw::before{content:"Rp";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink2);font-size:16px}
.amtw .in{min-height:60px;font-size:26px;font-weight:800;letter-spacing:-.01em;padding-left:50px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.seg .chip{padding:12px;border-radius:12px;font-size:15px;font-weight:700}
.seg .chip.on[data-val=out]{background:var(--out);border-color:var(--out)}
.seg .chip.on[data-val=in]{background:var(--in);border-color:var(--in)}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-weight:600;font-size:14px;color:var(--ink2)}
.ck input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:0}
.err{margin-top:12px;color:var(--out);font-weight:700;font-size:13.5px;min-height:0}
.err:empty{display:none}
.actions{display:grid;gap:10px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font-weight:800;padding:0 18px;border:1px solid var(--line);text-align:center}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.sm{min-height:38px;border-radius:12px;padding:0 14px;font-size:13.5px}
.btn.dng{color:var(--out)}
.btn.dngf{background:var(--out);border-color:var(--out);color:#fff}
:root[data-theme=dark] .btn.dngf{color:#0E151D}
.facts{margin-top:14px;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.facts span{color:var(--ink2)}
.facts b{text-align:right;font-weight:700;overflow-wrap:anywhere}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:10px;overflow-wrap:anywhere}
.big .cur{font-size:.5em;margin-right:.3em;color:var(--ink2)}
.dh{display:flex;align-items:center;gap:13px;padding-right:44px}
.dh .av{width:48px;height:48px;border-radius:16px;font-size:17px}
.dh h2{padding-right:0}
.dh .sub{margin-top:0}
.pct{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.pay{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
.pay b{font-weight:800}
.pay button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink2)}
.pay svg{width:18px;height:18px}
.h4{font-size:13px;font-weight:700;color:var(--ink2);margin-top:22px}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline>*{min-width:0}
.lockn{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--field);font-size:12.5px;font-weight:600;color:var(--ink2)}
.lockn svg{width:16px;height:16px;margin-top:1px}

/* ===== Keuangan ===== */
.wi{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;color:#fff;flex:none}
.wi svg{width:20px;height:20px;stroke-width:2}
.wi.sm{width:28px;height:28px;border-radius:9px}
.wi.sm svg{width:17px;height:17px}
.wi.xs{width:18px;height:18px;border-radius:6px}
.wi.xs svg{width:11px;height:11px;stroke-width:2.4}
.wi.tfi{background:var(--tf)}
.wh{display:flex;align-items:center;gap:9px;font-weight:700;min-width:0}
.kh-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kh-l{min-width:0;flex:1}
.kh .hd-big{font-size:clamp(26px,8vw,32px)}
.kh .hd-big.n2{font-size:clamp(22px,6.4vw,27px)}
.kh .hd-big.n3{font-size:clamp(19px,5.4vw,22px)}
.kh-d{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:4px 11px 4px 8px;border-radius:999px;background:rgba(255,255,255,.15);font-size:12.5px;font-weight:700;max-width:100%}
.kh-d svg{width:14px;height:14px;stroke-width:2.6}
.dnw{position:relative;width:96px;height:96px;flex:none}
.dn{width:100%;height:100%}
.dn circle{stroke-linecap:butt}
.dc{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.dc svg{width:26px;height:26px;opacity:.92}
.wleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:16px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.92)}
.wleg span{display:inline-flex;align-items:center;gap:6px}
.pi{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);display:inline-grid;place-items:center;flex:none}
.pi svg{width:12px;height:12px;stroke-width:2.6}

/* kartu dompet */
.wg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wc{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);min-width:0;text-align:left;transition:transform .12s}
.wc:active{transform:scale(.98)}
.wc-t{display:flex;align-items:center;gap:8px;min-width:0}
.wc .wnm{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink2);opacity:.8;flex:none}
.wc b{font-size:clamp(13.5px,4.2vw,16px);font-weight:800;white-space:nowrap}
.wc.on{border-color:var(--wc);box-shadow:inset 0 0 0 1.5px var(--wc)}
.wc.add{grid-column:1/-1;flex-direction:row;align-items:center;gap:11px;border-style:dashed;background:transparent}
.wc.add .wt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.wc.add .wnm{flex:none;font-size:13.5px;color:var(--acc)}
.wc.add small{font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.3}

/* rincian */
.card{margin:14px 14px 0;padding:14px 14px 8px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
.card h3{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.card h3 span:last-child{color:var(--ink)}
.bk{display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:center;padding:7px 0}
.bk .ci{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.bk .ci svg{width:19px;height:19px}
.bk-m{min-width:0}
.bk-in .ci{background:var(--in-bg);color:var(--in)}
.bk-out .ci{background:var(--out-bg);color:var(--out)}
.bk-h{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:600}
.bk-h>span{min-width:0;overflow-wrap:anywhere}
.bk-h b{font-weight:700;white-space:nowrap}
.bk-h small{color:var(--ink2);font-weight:600;margin-left:6px;font-size:12px}
.bk .bar{margin-top:6px}
.bk-in .bar i{background:var(--in)}
.bk-out .bar i{background:var(--out)}
.more{margin-top:2px;padding:8px 0;font-weight:700;font-size:13px;color:var(--acc)}

/* daftar transaksi */
.chip svg{width:13px;height:13px;margin-left:6px;vertical-align:-2px}
.chip .wi{margin-right:6px;vertical-align:-4px}
.chip .wi svg{width:11px;height:11px;margin:0;vertical-align:0}
.ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ti svg{width:20px;height:20px}
.ti-in{background:var(--in-bg);color:var(--in)}
.ti-out{background:var(--out-bg);color:var(--out)}
.ti-tf{background:var(--tf-bg);color:var(--tf)}
.row .amt.tf{color:var(--tf)}
.pl{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ar{display:inline-grid;place-items:center}
.ar svg{width:12px;height:12px}

/* tombol Masuk / Keluar */
#duo{position:fixed;right:max(14px,calc(50% - var(--col) / 2 + 14px));bottom:calc(var(--nav) + var(--sab) + 14px);z-index:15;display:flex;gap:6px;padding:6px;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(8,16,24,.26)}
#duo button{display:flex;align-items:center;gap:7px;height:46px;padding:0 17px 0 13px;border-radius:16px;font-weight:800;color:var(--onacc);transition:transform .12s}
#duo button:active{transform:scale(.96)}
#duo svg{width:19px;height:19px;stroke-width:2.5}
#fabOut{background:var(--out)}
#fabIn{background:var(--in)}

/* form */
.seg.s3{grid-template-columns:repeat(3,1fr);gap:6px}
.seg.s3 .chip{padding:12px 2px;font-size:13.5px}
.seg .chip.on[data-val=tf]{background:var(--tf);border-color:var(--tf)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ct{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 3px 9px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;min-width:0;overflow-wrap:anywhere}
.ct .ci{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--field);color:var(--ink2)}
.ct .ci svg{width:22px;height:22px}
.ct.on{border-color:var(--cc);background:var(--cbg);box-shadow:inset 0 0 0 1px var(--cc)}
.ct.on .ci{background:var(--cc);color:var(--onacc)}
.wpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wp{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--panel);min-width:0}
.wp .wh{font-size:14px}
.wp small{font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wp.on{border-color:var(--wc);box-shadow:inset 0 0 0 1.5px var(--wc);background:var(--field)}
.hint{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.hint:empty{display:none}
.hint.bad{color:var(--out)}
.lbs{display:block;font-weight:600;opacity:.85;margin-top:1px}
.split{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center}
.srow>*{min-width:0}
.srow .wh{font-size:14px}
.amtw.sm::before{left:12px;font-size:13px}
.amtw.sm .in{min-height:44px;font-size:16px;font-weight:700;padding-left:38px}
.srow .chip.sm{height:44px;padding:0 13px}
.tally{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--field);font-size:13px;font-weight:700;color:var(--ink2);display:grid;gap:8px}
.tally.ok{color:var(--in)}
.tally.warn{color:var(--warn)}
.tally.bad{color:var(--out)}
.wbar{display:flex;gap:2px;height:7px;border-radius:5px;overflow:hidden;background:var(--line)}
.wbar i{display:block;flex:1 1 0;min-width:5px}
.stk{position:sticky;bottom:calc(-20px - var(--sab));z-index:2;margin:20px 0 calc(-20px - var(--sab));padding:10px 0 calc(20px + var(--sab));background:var(--panel);box-shadow:0 -14px 14px -4px var(--panel)}
.stk .btn{width:100%}
.btn.full{width:100%;margin-top:14px}

/* ===== Lainnya ===== */
.grp{padding:20px 0 0}
.grp h3{font-size:13px;font-weight:700;color:var(--ink2);margin:0 18px 8px}
.item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
.dg>.item:last-child{border-bottom:0}
.item>span:not(.tl){flex:1;min-width:0}
.item b{display:block;font-weight:700}
.item small{display:block;color:var(--ink2);font-weight:600;font-size:12.5px;margin-top:1px}
.item>svg{color:var(--ink2);width:19px;height:19px;opacity:.7}
.item.dng b{color:var(--out)}
.tl{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--s,var(--field));color:var(--c,var(--ink2))}
.tl svg{width:20px;height:20px}
.t-todo{--s:var(--s-todo);--c:var(--a-todo)}
.t-kas{--s:var(--s-kas);--c:var(--a-kas)}
.t-hutang{--s:var(--s-hutang);--c:var(--a-hutang)}
.t-bta{--s:var(--s-bta);--c:var(--a-bta)}
.t-set{--s:var(--s-lain);--c:var(--ink)}
.t-dng{--s:var(--out-bg);--c:var(--out)}
.tseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.tseg button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px 9px;border-radius:13px;border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink2)}
.tseg button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--soft);color:var(--ink)}
.tp{width:46px;height:32px;border-radius:9px;border:1px solid rgba(128,140,152,.4);position:relative;overflow:hidden}
.tp::before{content:"";position:absolute;left:6px;top:6px;right:16px;height:5px;border-radius:3px;background:rgba(128,140,152,.55)}
.tp::after{content:"";position:absolute;left:6px;top:15px;right:8px;height:9px;border-radius:3px;background:rgba(128,140,152,.3)}
.tp.l{background:#F4F6F9}.tp.d{background:#16212C}
.tp.a{background:linear-gradient(90deg,#F4F6F9 50%,#16212C 50%)}
.bkp{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px 13px;padding:14px}
.bkp>div{min-width:0}
.bkp .btn{grid-column:1/-1}
.bkp b{display:block;font-weight:700}
.bkp small{display:block;color:var(--ink2);font-weight:600;font-size:12.5px;margin-top:1px}
.bkp .tl.warn{--s:var(--warn-bg);--c:var(--warn)}
.bkp .tl.ok{--s:var(--in-bg);--c:var(--in)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 12px}
.stats div{text-align:center;min-width:0}
.stats b{display:block;font-size:20px;font-weight:800}
.stats span{font-size:12px;font-weight:600;color:var(--ink2)}
.about{padding:24px 28px 0;color:var(--ink2);font-size:12.5px;font-weight:600;text-align:center}
.about b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:3px}

/* ===== Toast ===== */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + var(--sab) + 80px);z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast.top{bottom:auto;top:calc(var(--sat) + 12px)}
#toast div{pointer-events:auto;display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .2s ease-out;max-width:100%}
#toast button{font-weight:800;text-decoration:underline;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:359px){.dnw{width:78px;height:78px}.ringw{width:76px;height:76px}.rc b{font-size:17px}.wleg{gap:5px 10px}}
@media (max-height:480px) and (orientation:landscape){.hd{padding-top:calc(var(--sat) + 12px);padding-bottom:14px}.hd.pulls{padding-bottom:30px}#btaPane .hd{display:none}#btaFrame{margin-top:0;border-radius:0}}
@media (min-width:640px){#app{max-width:var(--col);margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}.sheet{max-width:520px;margin:0 auto}}
/* iPad dan tablet: kolom lebih lebar, kartu dompet 3 kolom, sheet jadi dialog di tengah */
@media (min-width:768px){
  :root{--col:720px}
  .wg{grid-template-columns:repeat(3,1fr)}
  .hd{padding-left:24px;padding-right:24px}
  .dg,.pull,.card{margin-left:20px;margin-right:20px}
  .flt,.blk{padding-left:20px;padding-right:20px}
  .sec{padding-left:24px;padding-right:24px}
  .grp h3{margin-left:24px}
  #sheetRoot{display:grid;place-items:center}
  .sheet{position:relative;left:auto;right:auto;bottom:auto;width:min(560px,92vw);max-width:none;margin:0;max-height:88vh;border-radius:24px;padding:22px 24px 24px;transform:translateY(18px) scale(.98);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
  #sheetRoot.on .sheet{transform:none;opacity:1}
  .grab{display:none}
  .sx{top:18px;right:18px}
  .stk{bottom:-24px;margin-bottom:-24px;padding-bottom:24px}
}
@media (min-width:1000px){:root{--col:760px}}
.rn{display:block;margin-top:3px;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkp{border-bottom:1px solid var(--line)}
</style>
</head>

const pvScript=u=>new Promise((ok,no)=>{try{const s=document.createElement('script');s.textContent=document.getElementById(u).textContent;document.head.appendChild(s);s.remove();ok()}catch(e){no(e)}});
async function pvLib(){
 if(window.docx&&window.JSZip)return;
 if(!window.JSZip){try{await pvScript('lib-jszip')}catch(e){await pvScript('lib-jszip')}}
 if(!window.docx){try{await pvScript('lib-docx')}catch(e){await pvScript('lib-docx')}}
}
function pvClose(){$('pvm').hidden=true;$('pvmB').innerHTML='';PVC=null}
async function pvDl(){if(!PVC)return;const c=PVC;await dl(c.blob,c.name);toast('⬇️ '+c.name+' diunduh')}
const EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pvXlsx(){
 const x=window.__xp;if(!x)return '<p class="ld">Preview tidak tersedia.</p>';
 const f=(s,m)=>{const[y,mo,d]=s.split('-').map(Number);return m?EN[mo-1]+'-'+String(y).slice(2):d+'-'+EN[mo-1]+'-'+String(y).slice(2)};
 return '<div class="pvx"><div class="sm">'+x.top.map(r=>r.map(esc).join(' &nbsp;·&nbsp; ')).join('<br>')+'</div><div style="overflow:auto;max-height:100%"><table><thead><tr>'+x.H.map(h=>'<th>'+esc(h||'')+'</th>').join('')+'</tr></thead><tbody>'+
  x.rows.map(([e,id])=>'<tr><td>'+f(e.date,1)+'</td><td>'+f(e.date)+'</td><td></td><td>'+[x.prj,e.type,id,e.site,x.eng,x.co,e.act,x.nik].map(v=>esc(v==null?'':v)).join('</td><td>')+'</td></tr>').join('')+'</tbody></table></div></div>';
}
function pvFallback(info){
 if(!info||!info.it)return '<p class="ld">Preview dokumen tidak bisa dimuat. File tetap bisa di-download.</p>';
 return '<div class="pvx"><p class="sm">⚠️ Preview Word butuh internet dan gagal dimuat, jadi ini ringkasan isinya. Layout asli ada di file hasil.</p><div class="pvf">'+info.it.map(x=>'<figure><img src="'+x.photo+'" alt=""><b>'+esc(x.date||'')+'</b><br>'+esc(x.desc||'')+(x.amt?'<br>Rp '+Number(x.amt).toLocaleString('id-ID'):'')+'</figure>').join('')+'</div></div>';
}
async function pvOpen(blob,name,kind,info){
 PVC={blob,name};$('pvmT').textContent=name;$('pvmN').textContent=(blob.size/1024<1024?Math.round(blob.size/1024)+' KB':(blob.size/1048576).toFixed(1)+' MB');
 const b=$('pvmB');b.innerHTML='<p class="ld">⏳ Menyiapkan preview...</p>';$('pvm').hidden=false;
 if(kind==='xlsx'){b.innerHTML=pvXlsx();return}
 try{await pvLib();if(PVC&&PVC.blob===blob){b.innerHTML='';await docx.renderAsync(blob,b,null,{inWrapper:true,breakPages:true,ignoreLastRenderedPageBreak:false})}}
 catch(e){if(PVC&&PVC.blob===blob)b.innerHTML=pvFallback(info)}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pvm').hidden)pvClose()});

function viewHutang() {

  ${open.length ? `<section class="pull pcard"><h3><span>${dir === 'owe' ? 'Sudah dibayar' : 'Sudah diterima'}</span><b>${pct}%</b></h3><span class="bar"><i style="width:${pct}%"></i></span><div class="pct"><span>${rpS(pd)}</span><span>dari ${rpS(orig)}</span></div></section>` : ''}

/* penghitung pembagian (uang masuk) dan catatan saldo (uang keluar / pindah) */
function trxTally(el) {

async function saveFile(name, text, mime) {
  if (isNative()) {
    name = safeName(name);
    const res = await nat('Filesystem', 'writeFile', { path: name, data: text, directory: 'CACHE', encoding: 'utf8' });
    await nat('Share', 'share', { title: name, dialogTitle: 'Simpan atau bagikan file', files: [res.uri] });
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
  a.download = safeName(name); document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function doSave(name, text, mime, okMsg) {
  try { await saveFile(name, text, mime); if (okMsg) toast(okMsg); return true; }
  catch (e) { if (!/cancel/i.test(String(e && e.message || e))) toast('Gagal menyimpan file. Coba lagi.'); return false; }
}
const blobB64 = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = no; r.readAsDataURL(b); });

    await nat('Share', 'share', { title: name, dialogTitle: 'Simpan atau bagikan file', files: [res.uri] });
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
};

    const out = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, MAXD).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

});
